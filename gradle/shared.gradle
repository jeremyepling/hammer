group = 'net.j40climb.florafauna_hammer'
version = "0.0.1+${minecraft_version}"
base.archivesName = "${mod_id}-${loader}"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repositories { mavenCentral() }

def loaderSources = sourceSets.create(loader)
def loaderPlaytest = sourceSets.create("${loader}Playtest")
stonecutter.constants.put('fabric', loader == 'fabric')
stonecutter.constants.put('neoforge', loader == 'neoforge')
sourceSets.main.java.source(loaderSources.java)
sourceSets.main.resources.source(loaderSources.resources)

tasks.named('processResources') {
    def ingredientFields = [
            loader: loader,
            typeKey: loader == 'fabric' ? 'fabric:type' : 'neoforge:ingredient_type',
            itemKey: loader == 'fabric' ? 'base' : 'items'
    ]
    inputs.properties ingredientFields
    filesMatching(['data/florafauna/recipe/resonant_hammer.json', 'data/florafauna/recipe/tempest_hammer.json']) {
        expand ingredientFields
    }
}

// Each target adds its own gameplay classes and assets to the shared sources.
sourceSets.main.java.srcDir 'target/main/java'
sourceSets.main.java.srcDir rootProject.file("versions/${minecraft_version}/target/main/java")
sourceSets.main.resources.srcDir rootProject.file("versions/${minecraft_version}/target/main/resources")
sourceSets.main.resources.srcDir 'target/main/resources'
sourceSets.create('playtest') {
    java.srcDir 'target/playtest/java'
    java.source(loaderPlaytest.java)
    resources.source(loaderPlaytest.resources)
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath
}
sourceSets.test {
    java.srcDir 'target/test/java'
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar') { from rootProject.file('LICENSE.txt') }
tasks.named('test') { useJUnitPlatform() }
tasks.named('check') { dependsOn 'compilePlaytestJava' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
