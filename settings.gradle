pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.kikugie.dev/releases' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'hammer'

stonecutter {
    centralScript = 'build.gradle'
    create(rootProject) {
        version('26.1-neoforge', '26.1')
        version('26.3-neoforge', '26.3')
        // A FloraFauna NeoForge composite can include Hammer using its older Gradle wrapper.
        if (gradle.parent == null || GradleVersion.current() >= GradleVersion.version('9.4')) {
            version('26.1-fabric', '26.1').buildscript('fabric.gradle')
            version('26.3-fabric', '26.3').buildscript('fabric.gradle')
        }
        vcsVersion = '26.1-neoforge'
    }
}
