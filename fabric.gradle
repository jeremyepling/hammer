plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom' version '1.16.3'
}

ext.loader = 'fabric'
apply from: rootProject.file('gradle/shared.gradle')

repositories { maven { url = 'https://maven.fabricmc.net/' } }
def fabricLoader = findProperty('fabric_loader_version') ?: '0.19.5'
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabricLoader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

def playtestId = providers.gradleProperty('playtestId').orNull
def playtestPhase = providers.gradleProperty('playtestPhase').orNull
if (playtestId && (!(playtestId ==~ /[0-9a-f]{32}/) || !(playtestPhase in ['1', '2']))) {
    throw new GradleException('Use scripts/test_hammer.ps1 to prepare an isolated client playtest.')
}

loom {
    accessWidenerPath = new File(loaderTarget, 'resources/hammer.accesswidener')
    mods {
        hammer { sourceSet sourceSets.main }
        if (playtestId) {
            hammer_playtest { sourceSet sourceSets.playtest }
        }
    }
    runs {
        gameTestServer {
            server()
            runDir 'run/gameTestServer'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.filter=${providers.gradleProperty('gameTestFilter').getOrElse('hammer:*')}"
            vmArg "-Dfabric-api.gametest.report-file=${file('build/test-results/gametest.xml')}"
        }
        if (playtestId) {
            worldPlaytest {
                client()
                source sourceSets.playtest
                def directory = rootProject.file(".tmp/world-playtests/${playtestId}/hammer")
                runDir project.relativePath(directory)
                programArgs '--width', '960', '--height', '540', '--quickPlaySingleplayer', 'playtest'
                vmArg "-Dhammer.playtest.directory=${directory}"
                vmArg "-Dhammer.playtest.scenario=${providers.gradleProperty('playtestScenario').getOrElse('hammer')}"
                vmArg "-Dhammer.playtest.phase=${playtestPhase}"
            }
        }
    }
}

processResources {
    def metadata = [version: project.version, minecraft_version: minecraft_version, fabric_loader_version: fabricLoader, fabric_api_version: fabric_api_version]
    inputs.properties metadata
    filesMatching('fabric.mod.json') { expand metadata }
}
