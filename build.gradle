import java.time.Duration

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

ext.loader = 'neoforge'
apply from: rootProject.file('gradle/shared.gradle')

if (project.name == '26.4-neoforge') {
    ext.neo_version = providers.gradleProperty('previewNeoVersion').get()
    ext.neo_version_range = "[${neo_version}]"
    repositories {
        exclusiveContent {
            forRepository { mavenLocal() }
            filter { includeVersion 'net.neoforged', 'neoforge', neo_version }
        }
    }
}

def playtestId = providers.gradleProperty('playtestId').orNull
def playtestPhase = providers.gradleProperty('playtestPhase').orNull
if (playtestId && (!(playtestId ==~ /[0-9a-f]{32}/) || !(playtestPhase in ['1', '2']))) {
    throw new GradleException('Use scripts/test_hammer.ps1 to prepare an isolated client playtest.')
}
neoForge {
    version = neo_version
    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gameTestServer')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'florafauna_hammer'
            programArguments.addAll '--tests', providers.gradleProperty('gameTestFilter').getOrElse('florafauna_hammer:*')
        }
        if (playtestId) {
            worldPlaytest {
                client()
                def directory = rootProject.file(".tmp/world-playtests/${playtestId}/hammer")
                gameDirectory = directory
                programArguments.addAll '--width', '960', '--height', '540', '--quickPlaySingleplayer', 'playtest'
                systemProperty 'florafauna.playtest.directory', directory.absolutePath
                systemProperty 'florafauna.playtest.scenario', providers.gradleProperty('playtestScenario').getOrElse('hammer')
                systemProperty 'florafauna.playtest.phase', playtestPhase
            }
        }
    }
    mods {
        florafauna_hammer {
            sourceSet sourceSets.main
            if (playtestId) sourceSet sourceSets.playtest
        }
    }
}
tasks.matching { it.name == 'runWorldPlaytest' }.configureEach { timeout = Duration.ofMinutes(4) }

processResources {
    def metadata = [version: project.version, minecraft_version_range: minecraft_version_range, neo_version_range: neo_version_range]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') { expand metadata }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
}
